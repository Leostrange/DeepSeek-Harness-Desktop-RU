name: Build Android embedded APK

on:
  push:
    branches:
      - temp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android source
        run: |
          cat ci/android-src.part00 ci/android-src.part01 ci/android-src.part02 ci/android-src.part03 ci/android-src.part04 ci/android-src.part05 ci/android-src.part06 ci/android-src.part07 > android-build-src.zip.b64
          base64 -d android-build-src.zip.b64 > android-build-src.zip
          unzip -t android-build-src.zip
          unzip -q -o android-build-src.zip

      - name: Apply patched runtime sources
        run: |
          cp ci/patches/DebExtractor.kt android/app/src/main/java/io/leostrange/dshandroid/runtime/DebExtractor.kt
          cp ci/patches/RuntimeInstaller.kt android/app/src/main/java/io/leostrange/dshandroid/runtime/RuntimeInstaller.kt
          cp ci/patches/NativeBuildConfig.kt android/app/src/main/java/io/leostrange/dshandroid/runtime/NativeBuildConfig.kt
          cp ci/patches/HarnessForegroundService.kt android/app/src/main/java/io/leostrange/dshandroid/HarnessForegroundService.kt

          cat > android/app/src/test/java/io/leostrange/dshandroid/runtime/NativeBuildConfigTest.kt <<'KOTLIN'
          package io.leostrange.dshandroid.runtime

          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertTrue

          class NativeBuildConfigTest {
              @Test
              fun includesNativeToolchainNeededByDsh() {
                  val required = NativeBuildConfig.requiredPackages
                  listOf("cmake", "clang", "make", "python", "binutils", "pkg-config", "libandroid-spawn")
                      .forEach { assertTrue(it in required, "missing $it") }
              }

              @Test
              fun targetsAndroidApi30ForNativeModules() {
                  val env = NativeBuildConfig.npmBuildEnvironment()
                  assertEquals("-target aarch64-linux-android30", env["CFLAGS"])
                  assertEquals("-target aarch64-linux-android30", env["CXXFLAGS"])
                  assertEquals("2", env["CMAKE_BUILD_PARALLEL_LEVEL"])
              }
          }
          KOTLIN

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarness-Android-native-toolchain-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
