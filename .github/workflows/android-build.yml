name: Build Android embedded APK

on:
  push:
    branches:
      - temp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android source
        run: |
          cat ci/android-src.part00 ci/android-src.part01 ci/android-src.part02 ci/android-src.part03 ci/android-src.part04 ci/android-src.part05 ci/android-src.part06 ci/android-src.part07 > android-build-src.zip.b64
          base64 -d android-build-src.zip.b64 > android-build-src.zip
          unzip -t android-build-src.zip
          unzip -q -o android-build-src.zip

      - name: Apply Android fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/src/main/java/io/leostrange/dshandroid/runtime/DebExtractor.kt')
          s = p.read_text()
          s = s.replace('runCatching { Os.lstat(file.path) }.onSuccess { Os.unlink(file.path) }', 'runCatching { Os.lstat(file.path) }.onSuccess { file.delete() }')
          needle = '                val entry = tar.nextTarEntry ?: break\n                val output = RuntimePaths.safeResolve(runtimeRoot, entry.name)'
          replacement = '                val entry = tar.nextTarEntry ?: break\n                val normalizedEntryName = entry.name.replace(\'\\\\\', \'/\').removePrefix("./")\n                if (normalizedEntryName.isBlank() || normalizedEntryName == ".") continue\n                val output = RuntimePaths.safeResolve(runtimeRoot, entry.name)'
          if needle not in s:
              raise SystemExit('DebExtractor root-entry patch anchor not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s)

          p = Path('android/app/src/main/java/io/leostrange/dshandroid/runtime/RuntimeInstaller.kt')
          s = p.read_text()
          s = s.replace('runCatching { android.system.Os.unlink(hostPath.path) }', 'hostPath.delete()')
          p.write_text(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarness-Android-embedded-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
