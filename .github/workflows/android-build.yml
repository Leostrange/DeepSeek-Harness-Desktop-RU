name: Build Android embedded APK

on:
  push:
    branches:
      - temp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android source
        run: |
          cat ci/android-src.part00 ci/android-src.part01 ci/android-src.part02 ci/android-src.part03 ci/android-src.part04 ci/android-src.part05 ci/android-src.part06 ci/android-src.part07 > android-build-src.zip.b64
          base64 -d android-build-src.zip.b64 > android-build-src.zip
          unzip -t android-build-src.zip
          unzip -q -o android-build-src.zip

      - name: Apply patched runtime sources
        run: |
          cp ci/patches/DebExtractor.kt android/app/src/main/java/io/leostrange/dshandroid/runtime/DebExtractor.kt
          cp ci/patches/RuntimeInstaller.kt android/app/src/main/java/io/leostrange/dshandroid/runtime/RuntimeInstaller.kt
          cp ci/patches/NativeBuildConfig.kt android/app/src/main/java/io/leostrange/dshandroid/runtime/NativeBuildConfig.kt
          cp ci/patches/HarnessForegroundService.kt android/app/src/main/java/io/leostrange/dshandroid/HarnessForegroundService.kt

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/src/main/java/io/leostrange/dshandroid/HarnessForegroundService.kt')
          s = p.read_text()
          s = s.replace('installHarness(runner)\n', 'installHarness(runner, installer.runtimeRoot)\n', 1)

          replacement = r'''    private fun installHarness(runner: ProotRunner, runtimeRoot: File) {
                  setState(HarnessStage.INSTALLING_HARNESS, "Устанавливаю @deepseek-ai/dsh без lifecycle-скриптов…")
                  appendLog("Installing @deepseek-ai/dsh package tree with --ignore-scripts…")
                  val env = NativeBuildConfig.npmBuildEnvironment() + mapOf(
                      "DSH_NO_LANDLOCK" to "1",
                      "CI" to "1",
                  )

                  val install = runner.start(
                      NativeBuildConfig.initialNpmInstallArgs(RuntimePaths.PREFIX),
                      env,
                  )
                  streamProcess(install)
                  if (!install.waitFor(12, TimeUnit.MINUTES)) {
                      install.destroy()
                      if (!install.waitFor(2, TimeUnit.SECONDS)) install.destroyForcibly()
                      throw IllegalStateException("npm package download timed out")
                  }
                  if (install.exitValue() != 0) {
                      throw IllegalStateException("npm package download failed (exit ${install.exitValue()})")
                  }

                  patchNodePtyPostInstall(runtimeRoot)

                  setState(HarnessStage.INSTALLING_HARNESS, "Компилирую native-модули Harness…")
                  appendLog("Rebuilding DSH lifecycle scripts after Android node-pty patch…")
                  val rebuild = runner.start(
                      listOf(
                          "${RuntimePaths.PREFIX}/bin/sh",
                          "-lc",
                          NativeBuildConfig.rebuildShellCommand(RuntimePaths.PREFIX),
                      ),
                      env,
                  )
                  streamProcess(rebuild)
                  if (!rebuild.waitFor(20, TimeUnit.MINUTES)) {
                      rebuild.destroy()
                      if (!rebuild.waitFor(2, TimeUnit.SECONDS)) rebuild.destroyForcibly()
                      throw IllegalStateException("npm rebuild @deepseek-ai/dsh timed out")
                  }
                  if (rebuild.exitValue() != 0) {
                      throw IllegalStateException("npm rebuild @deepseek-ai/dsh failed (exit ${rebuild.exitValue()})")
                  }
                  appendLog("Harness npm package and native modules installed")
              }

              private fun patchNodePtyPostInstall(runtimeRoot: File) {
                  val script = File(
                      RuntimePaths.hostPrefix(runtimeRoot),
                      "lib/node_modules/@deepseek-ai/dsh/node_modules/node-pty/scripts/post-install.js",
                  )
                  require(script.isFile) { "node-pty post-install.js not found" }
                  var text = script.readText()
                  if ("DSH Android: skip release cleanup under PRoot" in text) return

                  val anchor = "console.log('\\x1b[32m> Cleaning release folder...\\x1b[0m');"
                  require(anchor in text) { "Unsupported node-pty post-install.js layout" }
                  val androidGuard = """

          // DSH Android: PRoot may return EPERM for lstat() on the freshly linked
          // native addon inside obj.target. The Release/pty.node artifact is already
          // complete at this point, so cleanup is unnecessary on Android.
          if (os.platform() === 'android') {
            console.log('> DSH Android: skip release cleanup under PRoot');
            process.exit(0);
          }
          """.trimIndent()
                  text = text.replace(anchor, anchor + "\n" + androidGuard)
                  script.writeText(text)
                  appendLog("node-pty postinstall patched: Android cleanup disabled")
              }

'''
          s2, n = re.subn(
              r'    private fun installHarness\(runner: ProotRunner\) \{.*?\n    private fun installSharpWasmFallback\(runner: ProotRunner, runtimeRoot: File\) \{',
              replacement + '    private fun installSharpWasmFallback(runner: ProotRunner, runtimeRoot: File) {',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('installHarness patch failed')
          p.write_text(s2)
          PY

          cat > android/app/src/test/java/io/leostrange/dshandroid/runtime/NativeBuildConfigTest.kt <<'KOTLIN'
          package io.leostrange.dshandroid.runtime

          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertTrue

          class NativeBuildConfigTest {
              @Test
              fun includesNativeToolchainNeededByDsh() {
                  val required = NativeBuildConfig.requiredPackages
                  listOf("cmake", "clang", "make", "python", "binutils", "pkg-config", "libandroid-spawn")
                      .forEach { assertTrue(it in required, "missing $it") }
              }

              @Test
              fun targetsAndroidApi30ForNativeModules() {
                  val env = NativeBuildConfig.npmBuildEnvironment()
                  assertEquals("-target aarch64-linux-android30", env["CFLAGS"])
                  assertEquals("-target aarch64-linux-android30", env["CXXFLAGS"])
                  assertEquals("2", env["CMAKE_BUILD_PARALLEL_LEVEL"])
              }

              @Test
              fun installsPackageTreeBeforeRunningNativeScripts() {
                  val args = NativeBuildConfig.initialNpmInstallArgs("/prefix")
                  assertTrue("--ignore-scripts" in args)
                  assertEquals("@deepseek-ai/dsh", args.last())
                  val rebuild = NativeBuildConfig.rebuildShellCommand("/prefix")
                  assertTrue("npm' rebuild --foreground-scripts" in rebuild)
              }
          }
          KOTLIN

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarness-Android-node-pty-proot-fix-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
